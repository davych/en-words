<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="description" content="A personal English notebook with definitions, examples, and useful spoken sentences.">
    <title>English Notes</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="document">
      <header class="document-header">
        <h1>English Notes</h1>
      </header>
      <div id="notes" class="notes"><p class="status">Loading notes…</p></div>
      <section class="reading" aria-labelledby="reading-title">
        <h2 id="reading-title">Further reading and listening</h2>
        <div id="resources" class="resources"></div>
      </section>
    </main>
  </body>
</html>
